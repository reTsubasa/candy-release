name: finalize-release

on:
  repository_dispatch:
    types: [candy-artifact-ready]
  workflow_dispatch:
    inputs:
      release_kind:
        description: Artifact family to finalize
        required: true
        type: choice
        options:
          - runtime
          - core
      staging_tag:
        description: Existing incoming draft Release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candy-release-catalog
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      RELEASE_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.release_kind || github.event.client_payload.release_kind }}
      STAGING_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_tag || github.event.client_payload.staging_tag }}
      CATALOG_SIGNING_KEY: ${{ secrets.CANDY_CATALOG_SIGNING_KEY }}
      USIGN_COMMIT: c4c72b1b07945ee192361dc751291a7c98d6adcd
    steps:
      - name: Check out release control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test catalog replacement policy
        run: .github/scripts/catalog-policy-test.sh

      - name: Test Runtime ruleset verification policy
        run: .github/scripts/runtime-rulesets-verifier-test.sh

      - name: Build pinned catalog verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake gcc jq zstd
          git init -q /tmp/usign
          git -C /tmp/usign remote add origin https://github.com/openwrt/usign.git
          timeout 60 git -C /tmp/usign fetch --depth 1 origin "$USIGN_COMMIT"
          git -C /tmp/usign checkout -q FETCH_HEAD
          cmake -S /tmp/usign -B /tmp/usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign/build --parallel 2
          sudo install -m 0755 /tmp/usign/build/usign /usr/local/bin/usign

      - name: Download and validate draft assets
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "finalize-release: $*" >&2; return 1; }
          file_sha() { sha256sum "$1" | awk '{ print tolower($1) }'; }
          file_size() { wc -c < "$1" | tr -d ' '; }
          require_file() {
            local path=$1 maximum=$2 size
            test -f "$path" && test ! -L "$path" || fail "missing regular asset: $path"
            size=$(file_size "$path")
            test "$size" -gt 0 && test "$size" -le "$maximum" || fail "invalid asset size: $path"
          }
          metadata_asset() {
            local metadata=$1 component=$2 path=$3 expected_sha expected_size name
            name=${path##*/}
            expected_sha=$(jq -er --arg component "$component" --arg name "$name" '.artifacts[] | select(.component == $component and .name == $name) | .sha256' "$metadata")
            expected_size=$(jq -er --arg component "$component" --arg name "$name" '.artifacts[] | select(.component == $component and .name == $name) | .size_bytes' "$metadata")
            test "$(file_sha "$path")" = "$expected_sha" || fail "metadata SHA mismatch: $path"
            test "$(file_size "$path")" = "$expected_size" || fail "metadata size mismatch: $path"
          }
          verify_core_bundle() {
            local version=$1 target=$2 bundle=$3 checksum=$4 manifest=$5
            local checksum_sha checksum_name listing extract_dir inner_manifest inner_sig executable_sha
            if ! awk 'NF { count += 1; if (NF != 2) invalid = 1 } END { exit (count == 1 && !invalid) ? 0 : 1 }' "$checksum"; then
              fail "invalid Core checksum format: $checksum"
            fi
            checksum_sha=$(awk 'NR == 1 { print tolower($1) }' "$checksum")
            checksum_name=$(awk 'NR == 1 { print $2 }' "$checksum")
            printf '%s' "$checksum_sha" | grep -Eq '^[0-9a-f]{64}$' || fail "invalid Core checksum digest: $checksum"
            test "$checksum_name" = "$(basename "$bundle")" || fail "Core checksum names the wrong bundle: $checksum"
            test "$(file_sha "$bundle")" = "$checksum_sha" || fail "Core bundle checksum mismatch: $bundle"
            listing=$(tar -tzf "$bundle") || fail "cannot list Core bundle: $bundle"
            test "$listing" = $'candy-core\nmanifest.json\nmanifest.sig' || fail "invalid Core bundle contents: $bundle"
            extract_dir="$core_extract_root/$target"
            mkdir -p "$extract_dir"
            tar -xzf "$bundle" -C "$extract_dir" || fail "cannot extract Core bundle: $bundle"
            for artifact in candy-core manifest.json manifest.sig; do
              test -f "$extract_dir/$artifact" && test ! -L "$extract_dir/$artifact" && test -s "$extract_dir/$artifact" ||
                fail "invalid bundled Core artifact: $bundle/$artifact"
            done
            inner_manifest="$extract_dir/manifest.json"
            inner_sig="$extract_dir/manifest.sig"
            cmp "$manifest" "$inner_manifest" || fail "Core manifests differ: $manifest"
            usign -V -p keys/core-release.pub -m "$inner_manifest" -x "$inner_sig" ||
              fail "Core manifest signature is invalid: $bundle"
            jq -e --arg version "$version" --arg target "$target" '
              .schema_version == 1 and
              .process_api_version == .core.process_api_version and
              .process_api_version == 1 and .core.core_api_version == 1 and
              .core.core_version == $version and
              (.core.protocol_version | type == "object" and (.major | type == "number") and (.minor | type == "number")) and
              .artifact.target == $target and .artifact.target_os == "linux" and
              .artifact.libc == "musl" and .artifact.executable == "candy-core" and
              (.artifact.executable_sha256 | test("^[0-9a-f]{64}$"))
            ' "$manifest" >/dev/null || fail "Core manifest contract mismatch: $manifest"
            executable_sha=$(jq -er '.artifact.executable_sha256' "$manifest")
            test "$(file_sha "$extract_dir/candy-core")" = "$executable_sha" ||
              fail "Core executable SHA-256 mismatch: $bundle"
          }
          build_value() { local file=incoming/BUILD-INFO; case "${2:-}" in '') ;; *) file=$2 ;; esac; sed -n "s/^$1=//p" "$file" | tail -1; }

          case "$RELEASE_KIND:$STAGING_TAG" in
            runtime:incoming-runtime-v[0-9]*|core:incoming-core-v[0-9]*) ;;
            *) fail "invalid release kind or tag" ;;
          esac
          printf '%s' "$STAGING_TAG" | grep -Eq '^incoming-(runtime-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*|core-v[0-9]+\.[0-9]+\.[0-9]+)$' || fail "invalid staging tag"
          release_json=$(gh release view "$STAGING_TAG" --json tagName,isDraft)
          test "$(jq -r .tagName <<<"$release_json")" = "$STAGING_TAG" || fail "staging Release tag mismatch"
          test "$(jq -r .isDraft <<<"$release_json")" = true || fail "incoming Release must remain a draft"
          mkdir -m 0700 incoming
          gh release download "$STAGING_TAG" --dir incoming

          if test "$RELEASE_KIND" = runtime; then
            metadata=incoming/runtime-release-metadata.json
            require_file "$metadata" 1048576
            version=$(jq -er '.runtime.version' "$metadata")
            revision=$(jq -er '.runtime.revision' "$metadata")
            display="$version-r$revision"
            release_tag="runtime-v$display"
            test "$STAGING_TAG" = "incoming-$release_tag" || fail "Runtime staging tag mismatch"
            jq -e --arg tag "$release_tag" '
              .schema_version == 2 and .release_kind == "candy-runtime-openwrt-client" and
              .release_tag == $tag and .source.repository == "reTsubasa/candy-runtime" and
              (.source.commit | test("^[0-9a-f]{40,64}$")) and
              (.targets | type == "array") and
              ([.targets[].target_id] | sort) == ["ipq40xx-generic-arm_cortex-a7_neon-vfpv4","x86_64"] and
              ([.artifacts[].component] | sort) == ["luci","luci","runtime-client","runtime-client"]
            ' "$metadata" >/dev/null || fail "invalid Runtime release metadata"
            expected=$(jq -r '.artifacts[].name' "$metadata" | sort)
            expected=$(printf '%s\n' "$expected" BUILD-INFO-ipq40xx-generic-arm_cortex-a7_neon-vfpv4 BUILD-INFO-x86_64 SHA256SUMS SHA256SUMS-ipq40xx-generic-arm_cortex-a7_neon-vfpv4 SHA256SUMS-x86_64 runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json runtime-release-metadata-x86_64.json runtime-release-metadata.json | sort)
            actual=$(find incoming -maxdepth 1 -type f -printf '%f\n' | sort)
            test "$actual" = "$expected" || fail "unexpected Runtime release asset set"
            for target_id in x86_64 ipq40xx-generic-arm_cortex-a7_neon-vfpv4; do
              target_metadata="incoming/runtime-release-metadata-$target_id.json"
              require_file "$target_metadata" 1048576
              jq -e --arg id "$target_id" '
                .schema_version == 2 and .target.target_id == $id and
                .target.platform == "openwrt" and .target.role == "client" and
                .target.openwrt_release == "25.12.4" and .target.package_format == "apk" and
                (( $id == "x86_64" and .target.profile == "x86_64" and .target.openwrt_target == "x86/64" and .target.architecture == "x86_64" and .target.package_architecture == "x86_64") or
                 ( $id == "ipq40xx-generic-arm_cortex-a7_neon-vfpv4" and .target.profile == "ipq40xx-generic" and .target.openwrt_target == "ipq40xx/generic" and .target.architecture == "armv7" and .target.package_architecture == "arm_cortex-a7_neon-vfpv4"))
              ' "$target_metadata" >/dev/null || fail "invalid target Runtime metadata"
              build_info="incoming/BUILD-INFO-$target_id"
              require_file "$build_info" 65536
              test "$(build_value runtime_version "$build_info")" = "$version" || fail "BUILD-INFO Runtime version mismatch"
              test "$(build_value runtime_revision "$build_info")" = "$revision" || fail "BUILD-INFO Runtime revision mismatch"
              test "$(sed -n 's/^profile=//p' "$build_info")" = "$([ "$target_id" = x86_64 ] && printf x86_64 || printf ipq40xx-generic)" || fail "BUILD-INFO profile mismatch"
              case "$target_id" in
                x86_64) printf '%s' "$(build_value sdk_url "$build_info")" | grep -Eq '^https://downloads\.openwrt\.org/releases/25\.12\.4/targets/x86/64/openwrt-sdk-[^/]+\.tar\.zst$' || fail "x86 SDK URL is outside the pinned release" ;;
                ipq40xx-generic-arm_cortex-a7_neon-vfpv4) printf '%s' "$(build_value sdk_url "$build_info")" | grep -Eq '^https://downloads\.openwrt\.org/releases/25\.12\.4/targets/ipq40xx/generic/openwrt-sdk-[^/]+\.tar\.zst$' || fail "IPQ40xx SDK URL is outside the pinned release" ;;
              esac
              for component in runtime-client luci; do
                artifact=$(jq -r --arg id "$target_id" --arg c "$component" '.artifacts[] | select(.component == $c) | .name' "$target_metadata")
                require_file "incoming/$artifact" 16777216
                metadata_asset "$target_metadata" "$component" "incoming/$artifact"
              done
            done
            require_file incoming/SHA256SUMS 131072
            (cd incoming && sha256sum -c SHA256SUMS)
            client=$(jq -r '.artifacts[] | select(.component == "runtime-client") | .name' incoming/runtime-release-metadata-x86_64.json)
            # APK metadata and checksums alone do not prove that the package
            # contains the product payload that was audited in Runtime. Do a
            # real extraction and reject deployable placeholders or truncated
            # bootstrap data before anything can become a stable release.
            payload_dir=$(mktemp -d)
            # OpenWrt APKs use OpenWrt's apk-tools format. Download the
            # matching host tool from the SDK declared by BUILD-INFO rather
            # than attempting to treat the signed package as a tar stream.
            sdk_url=$(build_value sdk_url incoming/BUILD-INFO-x86_64)
            printf '%s' "$sdk_url" | grep -Eq '^https://downloads\.openwrt\.org/releases/25\.12\.4/targets/x86/64/openwrt-sdk-[^/]+\.tar\.zst$' ||
              fail "BUILD-INFO SDK URL is outside the pinned OpenWrt release"
            sdk_root=$(mktemp -d)
            sdk_archive="$sdk_root/${sdk_url##*/}"
            sdk_checksums="$sdk_root/sha256sums"
            curl --fail --location --retry 3 --output "$sdk_archive" "$sdk_url"
            curl --fail --location --retry 3 --output "$sdk_checksums" "${sdk_url%/*}/sha256sums"
            sdk_sha=$(awk -v name="${sdk_url##*/}" '$2 == name || $2 == "*" name { print tolower($1); exit }' "$sdk_checksums")
            printf '%s' "$sdk_sha" | grep -Eq '^[0-9a-f]{64}$' || fail "OpenWrt SDK checksum is missing"
            test "$(file_sha "$sdk_archive")" = "$sdk_sha" || fail "OpenWrt SDK checksum mismatch"
            tar --zstd -xf "$sdk_archive" -C "$sdk_root"
            apk_tool=$(find "$sdk_root" -type f -path '*/staging_dir/host/bin/apk' -perm -111 -print -quit)
            test -n "$apk_tool" || fail "OpenWrt SDK does not contain host apk-tools"
            "$apk_tool" extract --allow-untrusted --no-chown \
              --destination "$payload_dir" "incoming/$client" >/dev/null
            client_config="$payload_dir/etc/config/candy"
            client_init="$payload_dir/etc/init.d/candy"
            rules_dir="$payload_dir/usr/share/candy/rulesets"
            core_release_key="$payload_dir/usr/share/candy/keys/core-release.pub"
            test -s "$client_config" || fail "Runtime APK is missing /etc/config/candy"
            test -x "$client_init" || fail "Runtime APK is missing executable /etc/init.d/candy"
            awk '
              /^config node / { in_node=1; next }
              /^config / { in_node=0 }
              in_node && /option enabled '\''1'\''/ { found=1 }
              END { exit found ? 1 : 0 }
            ' "$client_config" || fail "Runtime APK contains an enabled default node"
            ! grep -Eq "option (server|server_name) ['](127\\.0\\.0\\.1(:[0-9]+)?|localhost)" "$client_config" ||
              fail "Runtime APK contains a deployable placeholder endpoint"
            ! grep -Eq "option (server_pin|auth) ['][^']*(change-me|replace-me)" "$client_config" ||
              fail "Runtime APK contains a placeholder credential"
            test -s "$rules_dir/cn-ip.cidr" && test -s "$rules_dir/gfwlist.domains" || fail "Runtime APK is missing bootstrap rulesets"
            "$GITHUB_WORKSPACE/.github/scripts/verify-runtime-rulesets.sh" "$rules_dir" >/dev/null ||
              fail "Runtime APK bootstrap rulesets do not match their reviewed manifest"
            test -f "$core_release_key" && test ! -L "$core_release_key" || fail "Runtime APK is missing the Core release public key"
            test "$(usign -F -p "$core_release_key")" = d78de22abfca5b57 || fail "Runtime APK contains the wrong Core release public key"
            grep -Fq 'fail_open_locked()' "$client_init" || fail "Runtime APK has no fail-open path"
            grep -Fq '/var/lib/candy/service.lock' "$client_init" || fail "Runtime APK lifecycle lock is not persistent/root-owned"
            key="v$(tr '.+-' '___' <<<"$version" | tr -d '\n')_r$revision"
            jq -n \
              --arg version "$version" --argjson revision "$revision" --arg display "$display" \
              --arg commit "$(jq -r .source.commit "$metadata")" \
              --arg client_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$client" \
              --arg client_sha "$(file_sha "incoming/$client")" --argjson client_size "$(file_size "incoming/$client")" \
              --arg luci_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$(jq -r '.artifacts[] | select(.component == "luci") | .name' incoming/runtime-release-metadata-x86_64.json)" \
              --arg luci_sha "$(jq -r '.artifacts[] | select(.component == "luci") | .sha256' incoming/runtime-release-metadata-x86_64.json)" --argjson luci_size "$(jq -r '.artifacts[] | select(.component == "luci") | .size_bytes' incoming/runtime-release-metadata-x86_64.json)" \
              --arg arm_client_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$(jq -r '.artifacts[] | select(.component == "runtime-client") | .name' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" \
              --arg arm_client_sha "$(jq -r '.artifacts[] | select(.component == "runtime-client") | .sha256' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" --argjson arm_client_size "$(jq -r '.artifacts[] | select(.component == "runtime-client") | .size_bytes' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" \
              --arg arm_luci_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$(jq -r '.artifacts[] | select(.component == "luci") | .name' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" \
              --arg arm_luci_sha "$(jq -r '.artifacts[] | select(.component == "luci") | .sha256' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" --argjson arm_luci_size "$(jq -r '.artifacts[] | select(.component == "luci") | .size_bytes' incoming/runtime-release-metadata-ipq40xx-generic-arm_cortex-a7_neon-vfpv4.json)" \
              '{version:$version,revision:$revision,display_version:$display,commit:$commit,targets:{openwrt_25_12_4_x86_64:{openwrt_release:"25.12.4",target:"x86/64",arch:"x86_64",package_format:"apk",candy_client:{url:$client_url,sha256:$client_sha,size:$client_size},luci_app_candy:{url:$luci_url,sha256:$luci_sha,size:$luci_size}},openwrt_25_12_4_arm_cortex_a7_neon_vfpv4:{openwrt_release:"25.12.4",target:"ipq40xx/generic",arch:"arm_cortex-a7_neon-vfpv4",package_format:"apk",candy_client:{url:$arm_client_url,sha256:$arm_client_sha,size:$arm_client_size},luci_app_candy:{url:$arm_luci_url,sha256:$arm_luci_sha,size:$arm_luci_size}}}}' > entry.json
            comparison_version=$display
          else
            metadata=incoming/core-release-metadata.json
            require_file "$metadata" 1048576
            version=$(jq -er '.core.version' "$metadata")
            release_tag="core-v$version"
            test "$STAGING_TAG" = "incoming-$release_tag" || fail "Core staging tag mismatch"
            jq -e --arg tag "$release_tag" '
              .schema_version == 2 and .release_kind == "candy-core" and .release_tag == $tag and
              .source.repository == "reTsubasa/candy-core" and (.source.commit | test("^[0-9a-f]{40,64}$")) and
              ([.targets[].rust_target] | sort) == ["armv7-unknown-linux-musleabihf","x86_64-unknown-linux-musl"] and
              (.artifacts | length) == 6 and .signature.format == "usign" and .signature.verified == true
            ' "$metadata" >/dev/null || fail "invalid Core release metadata"
            base="candy-core-$version-x86_64-unknown-linux-musl"
            bundle="$base.tar.gz"
            checksum="$bundle.sha256"
            manifest="$base.manifest.json"
            expected=$(jq -r '.artifacts[].name' "$metadata" | sort)
            expected=$(printf '%s\n' "$expected" core-release-metadata.json | sort)
            actual=$(find incoming -maxdepth 1 -type f -printf '%f\n' | sort)
            test "$actual" = "$expected" || fail "unexpected Core release asset set"
            require_file "incoming/$bundle" 134217728
            require_file "incoming/$checksum" 65536
            require_file "incoming/$manifest" 1048576
            metadata_asset "$metadata" core-bundle "incoming/$bundle"
            metadata_asset "$metadata" bundle-checksum "incoming/$checksum"
            metadata_asset "$metadata" core-manifest "incoming/$manifest"
            arm_base="candy-core-$version-armv7-unknown-linux-musleabihf"
            arm_bundle="$arm_base.tar.gz"
            arm_checksum="$arm_bundle.sha256"
            arm_manifest="$arm_base.manifest.json"
            require_file "incoming/$arm_bundle" 134217728
            require_file "incoming/$arm_checksum" 65536
            require_file "incoming/$arm_manifest" 1048576
            metadata_asset "$metadata" core-bundle "incoming/$arm_bundle"
            metadata_asset "$metadata" bundle-checksum "incoming/$arm_checksum"
            metadata_asset "$metadata" core-manifest "incoming/$arm_manifest"
            core_extract_root=$(mktemp -d)
            verify_core_bundle "$version" "x86_64-unknown-linux-musl" "incoming/$bundle" "incoming/$checksum" "incoming/$manifest"
            verify_core_bundle "$version" "armv7-unknown-linux-musleabihf" "incoming/$arm_bundle" "incoming/$arm_checksum" "incoming/$arm_manifest"
            process_api=$(jq -er '.process_api_version' "incoming/$manifest")
            core_api=$(jq -er '.core.core_api_version' "incoming/$manifest")
            protocol=$(jq -er '.core.protocol_version | "\(.major).\(.minor)"' "incoming/$manifest")
            jq -e --arg version "$version" --argjson process_api "$process_api" --argjson core_api "$core_api" --arg protocol "$protocol" '
              .core.core_version == $version and
              .core.process_api_version == $process_api and
              .core.core_api_version == $core_api and
              .core.protocol_version == $protocol
            ' "$metadata" >/dev/null || fail "Core release metadata disagrees with signed manifests"
            jq -e --argjson process_api "$process_api" --argjson core_api "$core_api" --arg protocol "$protocol" '
              .process_api_version == $process_api and .core.core_api_version == $core_api and
              (.core.protocol_version | "\(.major).\(.minor)") == $protocol
            ' "incoming/$arm_manifest" >/dev/null || fail "ARM Core manifest API/protocol differs from x86"
            key="v$(tr '.+-' '___' <<<"$version" | tr -d '\n')"
            jq -n \
              --arg version "$version" --arg commit "$(jq -r .source.commit "$metadata")" \
              --argjson process_api "$(jq -r .core.process_api_version "$metadata")" \
              --argjson core_api "$(jq -r .core.core_api_version "$metadata")" \
              --arg protocol "$(jq -r .core.protocol_version "$metadata")" \
              --arg url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$bundle" \
              --arg sha "$(file_sha "incoming/$bundle")" --argjson size "$(file_size "incoming/$bundle")" \
              --arg arm_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$arm_bundle" \
              --arg arm_sha "$(file_sha "incoming/$arm_bundle")" --argjson arm_size "$(file_size "incoming/$arm_bundle")" \
              '{version:$version,commit:$commit,process_api_version:$process_api,core_api_version:$core_api,protocol_version:$protocol,targets:{linux_musl_x86_64:{target:"x86_64-unknown-linux-musl",os:"linux",libc:"musl",arch:"x86_64",url:$url,sha256:$sha,size:$size},linux_musl_armv7:{target:"armv7-unknown-linux-musleabihf",os:"linux",libc:"musl",arch:"arm",url:$arm_url,sha256:$arm_sha,size:$arm_size}}}' > entry.json
            comparison_version=$version
          fi

          : > release-assets.ndjson
          while IFS= read -r -d '' asset; do
            jq -n \
              --arg name "${asset##*/}" \
              --arg sha256 "$(file_sha "$asset")" \
              --argjson size "$(file_size "$asset")" \
              '{name:$name,sha256:$sha256,size:$size}' >> release-assets.ndjson
          done < <(find incoming -maxdepth 1 -type f -print0 | sort -z)
          jq -s . release-assets.ndjson > release-assets.json
          jq --slurpfile assets release-assets.json '. + {release_assets:$assets[0]}' \
            entry.json > entry.json.next
          mv entry.json.next entry.json
          jq -e . entry.json >/dev/null
          {
            echo "key=$key"
            echo "version=$comparison_version"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Publish assets and signed stable catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY: ${{ steps.artifact.outputs.key }}
          RELEASE_VERSION: ${{ steps.artifact.outputs.version }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          set -Eeuo pipefail
          fail() { echo "finalize-release: $*" >&2; return 1; }
          file_sha() { sha256sum "$1" | awk '{ print tolower($1) }'; }
          file_size() { wc -c < "$1" | tr -d ' '; }
          asset_manifest() {
            local directory=$1 output=$2 asset temporary
            temporary="$output.ndjson"
            : > "$temporary"
            while IFS= read -r -d '' asset; do
              jq -n \
                --arg name "${asset##*/}" \
                --arg sha256 "$(file_sha "$asset")" \
                --argjson size "$(file_size "$asset")" \
                '{name:$name,sha256:$sha256,size:$size}' >> "$temporary"
            done < <(find "$directory" -maxdepth 1 -type f -print0 | sort -z)
            jq -s . "$temporary" > "$output"
            rm -f "$temporary"
          }
          test -n "$CATALOG_SIGNING_KEY" || fail "CANDY_CATALOG_SIGNING_KEY is not configured"
          git pull --ff-only origin main
          catalog_before_commit=$(git rev-parse HEAD)
          mkdir -p channels
          if test -f channels/stable.json; then
            jq -e '.schema_version == 1 and .channel == "stable" and (.sequence | type == "number")' channels/stable.json >/dev/null || fail "existing stable catalog is invalid"
          else
            jq -n '{schema_version:1,sequence:0,channel:"stable",published_at:null,runtime:{latest:null,releases:{}},core:{latest:null,releases:{}}}' > channels/stable.json
          fi

          decision=$(.github/scripts/catalog-policy.sh \
            channels/stable.json entry.json "$RELEASE_KIND" "$RELEASE_KEY" "$RELEASE_VERSION")
          case "$decision" in
            new|replace-latest) changed=1 ;;
            unchanged) changed=0 ;;
            *) fail "unexpected catalog policy decision: $decision" ;;
          esac

          latest_key=$(jq -r --arg kind "$RELEASE_KIND" '.[$kind].latest // empty' channels/stable.json)
          is_latest=0
          test "$latest_key" = "$RELEASE_KEY" && is_latest=1
          formal_existed=0
          formal_was_draft=false
          formal_matches=0
          mkdir -m 0700 published
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            formal_existed=1
            formal_was_draft=$(jq -r .isDraft <<<"$release_json")
            if test "$(jq '.assets | length' <<<"$release_json")" -gt 0; then
              gh release download "$RELEASE_TAG" --dir published
            fi
            asset_manifest published published-assets.json
            cmp -s published-assets.json release-assets.json && formal_matches=1
          fi

          if test "$formal_existed" = 1 && test "$formal_matches" = 0; then
            case "$decision:$is_latest" in
              replace-latest:1|unchanged:1) ;;
              *) fail "formal $RELEASE_TAG assets differ from an immutable or untracked release" ;;
            esac
          fi

          release_write=0
          if test "$formal_existed" = 0 || test "$formal_matches" = 0 || test "$formal_was_draft" = true; then
            release_write=1
          fi

          if test "$decision" = unchanged && test "$is_latest" = 1 && test "$release_write" = 1; then
            changed=1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          remote_tag_commit=$(git ls-remote --tags origin "$tag_ref^{}" | awk 'NR == 1 { print $1 }')
          if test -z "$remote_tag_commit"; then
            remote_tag_commit=$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')
          fi
          if test "$formal_existed" = 1 && test -z "$remote_tag_commit"; then
            fail "formal Release exists but its tag is missing"
          fi
          if test "$formal_existed" = 0 && test -n "$remote_tag_commit"; then
            fail "tag exists without a formal Release; refusing to reuse it"
          fi
          tag_mutated=0
          catalog_pushed=0

          if test "$decision" = unchanged && test "$release_write" = 0; then
            echo "Release and catalog entry already finalized"
            gh release delete "$STAGING_TAG" --yes || true
            exit 0
          fi

          if test "$changed" = 1; then
            published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            jq --arg kind "$RELEASE_KIND" --arg key "$RELEASE_KEY" --arg published_at "$published_at" --slurpfile entry entry.json '
              .sequence += 1 |
              .published_at = $published_at |
              .[$kind].releases[$key] = $entry[0] |
              .[$kind].latest = $key
            ' channels/stable.json > channels/stable.json.next
            mv channels/stable.json.next channels/stable.json

            key_file=$(mktemp)
            chmod 0600 "$key_file"
            printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key_file"
            usign -S -s "$key_file" -m channels/stable.json -x channels/stable.json.sig
            usign -V -p keys/catalog-release.pub -m channels/stable.json -x channels/stable.json.sig

            runtime_display=$(jq -r '.runtime.latest as $key | if $key then .runtime.releases[$key].display_version else "not published" end' channels/stable.json)
            core_display=$(jq -r '.core.latest as $key | if $key then .core.releases[$key].version else "not published" end' channels/stable.json)
            sequence=$(jq -r .sequence channels/stable.json)
            published_at=$(jq -r .published_at channels/stable.json)
            python3 - "$runtime_display" "$core_display" "$sequence" "$published_at" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("README.md")
          text = path.read_text()
          start = "<!-- stable-status:start -->"
          end = "<!-- stable-status:end -->"
          block = "\n".join([
              start,
              "## Current stable channel",
              "",
              f"- Runtime: `{sys.argv[1]}`",
              f"- Core: `{sys.argv[2]}`",
              f"- Catalog sequence: `{sys.argv[3]}`",
              f"- Published at: `{sys.argv[4]}`",
              end,
          ])
          before, marker, remainder = text.partition(start)
          if not marker:
              raise SystemExit("README stable status markers are missing")
          _, marker, after = remainder.partition(end)
          if not marker:
              raise SystemExit("README stable status end marker is missing")
          path.write_text(before + block + after)
          PY

            git config user.name candy-release-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add channels/stable.json channels/stable.json.sig README.md
            git diff --cached --check
            git commit -m "release: publish $RELEASE_TAG"
          fi
          catalog_commit=$(git rev-parse HEAD)

          remote_ref_commit() {
            local ref=$1
            git ls-remote origin "$ref" | awk 'NR == 1 { print $1 }'
          }
          push_release_tag() {
            local commit=$1 force=${2:-0} observed
            if test "$force" = 1; then
              if git push --force origin "$commit:$tag_ref"; then return 0; fi
            elif git push origin "$commit:$tag_ref"; then
              return 0
            fi
            observed=$(remote_ref_commit "$tag_ref^{}")
            test -n "$observed" || observed=$(remote_ref_commit "$tag_ref")
            test "$observed" = "$commit"
          }
          push_catalog_commit() {
            local observed
            if git push origin HEAD:main; then return 0; fi
            observed=$(remote_ref_commit refs/heads/main)
            if test "$observed" = "$catalog_commit"; then return 0; fi
            git fetch --quiet origin main || return 1
            git merge-base --is-ancestor "$catalog_commit" FETCH_HEAD
          }

          rollback_release() {
            local status=$1 name rollback_failed=0 rollback_json rollback_tag rollback_catalog expected_catalog
            trap - ERR INT TERM
            set +e
            echo "finalize-release: restoring formal Release after failure" >&2
            if test "$formal_existed" = 1; then
              while IFS= read -r name; do
                test -n "$name" || continue
                if ! test -f "published/$name"; then
                  gh release delete-asset "$RELEASE_TAG" "$name" --yes || rollback_failed=1
                fi
              done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null)
              if find published -maxdepth 1 -type f -print -quit | grep -q .; then
                gh release upload "$RELEASE_TAG" published/* --clobber || rollback_failed=1
              fi
              gh release edit "$RELEASE_TAG" --draft="$formal_was_draft" || rollback_failed=1
            else
              gh release delete "$RELEASE_TAG" --yes || rollback_failed=1
            fi
            if test "$tag_mutated" = 1; then
              if test -n "$remote_tag_commit"; then
                git push --force origin "$remote_tag_commit:$tag_ref" || rollback_failed=1
              else
                git push origin ":$tag_ref" || rollback_failed=1
              fi
            fi
            if test "$formal_existed" = 1; then
              rollback_json=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null) || rollback_failed=1
              if test -n "$rollback_json"; then
                rollback_tag=$(jq -r .isDraft <<<"$rollback_json")
                test "$rollback_tag" = "$formal_was_draft" || rollback_failed=1
                rm -rf rollback-verified
                mkdir -m 0700 rollback-verified
                if test "$(jq '.assets | length' <<<"$rollback_json")" -gt 0; then
                  gh release download "$RELEASE_TAG" --dir rollback-verified || rollback_failed=1
                fi
                asset_manifest rollback-verified rollback-assets.json
                cmp -s rollback-assets.json published-assets.json || rollback_failed=1
              fi
            else
              if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
                rollback_failed=1
              fi
            fi
            rollback_tag=$(remote_ref_commit "$tag_ref^{}")
            test -n "$rollback_tag" || rollback_tag=$(remote_ref_commit "$tag_ref")
            if test -n "$remote_tag_commit"; then
              test "$rollback_tag" = "$remote_tag_commit" || rollback_failed=1
            else
              test -z "$rollback_tag" || rollback_failed=1
            fi
            expected_catalog=$catalog_before_commit
            test "$catalog_pushed" = 1 && expected_catalog=$catalog_commit
            rollback_catalog=$(remote_ref_commit refs/heads/main)
            test "$rollback_catalog" = "$expected_catalog" || rollback_failed=1
            if test "$rollback_failed" = 1; then
              echo "finalize-release: ERROR rollback verification failed; manual reconciliation required" >&2
              exit 1
            fi
            exit "$status"
          }

          if test "$changed" = 1 || test "$release_write" = 1; then
            trap 'rollback_release $?' ERR
            trap 'rollback_release 130' INT TERM
          fi
          if test "$changed" = 1 && test "$formal_existed" = 0; then
            if push_release_tag "$catalog_commit"; then
              tag_mutated=1
            else
              fail "could not create the release tag at the catalog commit"
            fi
          fi
          if test "$release_write" = 1; then
            if test "$formal_existed" = 1; then
              if test "$formal_matches" = 0; then
                while IFS= read -r name; do
                  test -n "$name" || continue
                  test -f "incoming/$name" || gh release delete-asset "$RELEASE_TAG" "$name" --yes
                done < <(jq -r '.[].name' published-assets.json)
                gh release upload "$RELEASE_TAG" incoming/* --clobber
              fi
            else
              if test "$RELEASE_KIND" = runtime; then
                title="Candy Runtime $RELEASE_VERSION"
              else
                title="Candy Core $RELEASE_VERSION"
              fi
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" \
                --notes "Validated by the centralized Candy release workflow."
              gh release upload "$RELEASE_TAG" incoming/*
            fi
            mkdir -m 0700 verified
            gh release download "$RELEASE_TAG" --dir verified
            asset_manifest verified verified-assets.json
            cmp verified-assets.json release-assets.json \
              || fail "formal Release verification differs from validated incoming assets"
            gh release edit "$RELEASE_TAG" --draft=false
          fi

          if test "$changed" = 1 && test "$formal_existed" = 1 && test "$remote_tag_commit" != "$catalog_commit"; then
            if push_release_tag "$catalog_commit" 1; then
              tag_mutated=1
            else
              fail "could not update the release tag to the catalog commit"
            fi
          fi

          if test "$changed" = 1; then
            if push_catalog_commit; then
              catalog_pushed=1
            else
              fail "catalog push was not confirmed on origin/main"
            fi
          fi
          trap - ERR INT TERM
          gh release delete "$STAGING_TAG" --yes || true
