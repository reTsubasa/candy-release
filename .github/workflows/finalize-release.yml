name: finalize-release

on:
  repository_dispatch:
    types: [candy-artifact-ready]
  workflow_dispatch:
    inputs:
      release_kind:
        description: Artifact family to finalize
        required: true
        type: choice
        options:
          - runtime
          - core
      staging_tag:
        description: Existing incoming draft Release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candy-release-catalog
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      RELEASE_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.release_kind || github.event.client_payload.release_kind }}
      STAGING_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_tag || github.event.client_payload.staging_tag }}
      CATALOG_SIGNING_KEY: ${{ secrets.CANDY_CATALOG_SIGNING_KEY }}
      USIGN_COMMIT: c4c72b1b07945ee192361dc751291a7c98d6adcd
    steps:
      - name: Check out release control repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test catalog replacement policy
        run: .github/scripts/catalog-policy-test.sh

      - name: Build pinned catalog verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake gcc jq
          git init -q /tmp/usign
          git -C /tmp/usign remote add origin https://github.com/openwrt/usign.git
          timeout 60 git -C /tmp/usign fetch --depth 1 origin "$USIGN_COMMIT"
          git -C /tmp/usign checkout -q FETCH_HEAD
          cmake -S /tmp/usign -B /tmp/usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign/build --parallel 2
          sudo install -m 0755 /tmp/usign/build/usign /usr/local/bin/usign

      - name: Download and validate draft assets
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "finalize-release: $*" >&2; return 1; }
          file_sha() { sha256sum "$1" | awk '{ print tolower($1) }'; }
          file_size() { wc -c < "$1" | tr -d ' '; }
          require_file() {
            local path=$1 maximum=$2 size
            test -f "$path" && test ! -L "$path" || fail "missing regular asset: $path"
            size=$(file_size "$path")
            test "$size" -gt 0 && test "$size" -le "$maximum" || fail "invalid asset size: $path"
          }
          metadata_asset() {
            local metadata=$1 component=$2 path=$3 expected_sha expected_size
            expected_sha=$(jq -er --arg component "$component" '.artifacts[] | select(.component == $component) | .sha256' "$metadata")
            expected_size=$(jq -er --arg component "$component" '.artifacts[] | select(.component == $component) | .size_bytes' "$metadata")
            test "$(file_sha "$path")" = "$expected_sha" || fail "metadata SHA mismatch: $path"
            test "$(file_size "$path")" = "$expected_size" || fail "metadata size mismatch: $path"
          }
          build_value() { sed -n "s/^$1=//p" incoming/BUILD-INFO | tail -1; }

          case "$RELEASE_KIND:$STAGING_TAG" in
            runtime:incoming-runtime-v[0-9]*|core:incoming-core-v[0-9]*) ;;
            *) fail "invalid release kind or tag" ;;
          esac
          printf '%s' "$STAGING_TAG" | grep -Eq '^incoming-(runtime-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*|core-v[0-9]+\.[0-9]+\.[0-9]+)$' || fail "invalid staging tag"
          release_json=$(gh release view "$STAGING_TAG" --json tagName,isDraft)
          test "$(jq -r .tagName <<<"$release_json")" = "$STAGING_TAG" || fail "staging Release tag mismatch"
          test "$(jq -r .isDraft <<<"$release_json")" = true || fail "incoming Release must remain a draft"
          mkdir -m 0700 incoming
          gh release download "$STAGING_TAG" --dir incoming

          if test "$RELEASE_KIND" = runtime; then
            metadata=incoming/runtime-release-metadata.json
            require_file "$metadata" 1048576
            version=$(jq -er '.runtime.version' "$metadata")
            revision=$(jq -er '.runtime.revision' "$metadata")
            display="$version-r$revision"
            release_tag="runtime-v$display"
            test "$STAGING_TAG" = "incoming-$release_tag" || fail "Runtime staging tag mismatch"
            jq -e --arg tag "$release_tag" '
              .schema_version == 1 and
              .release_kind == "candy-runtime-openwrt-client" and
              .release_tag == $tag and
              .source.repository == "reTsubasa/candy-runtime" and
              (.source.commit | test("^[0-9a-f]{40}$")) and
              .target.platform == "openwrt" and .target.role == "client" and
              .target.openwrt_release == "25.12.4" and
              .target.profile == "x86_64" and .target.architecture == "x86_64" and
              .target.package_format == "apk" and (.artifacts | length) == 2
            ' "$metadata" >/dev/null || fail "invalid Runtime release metadata"
            client="candy-client-$display.apk"
            luci="luci-app-candy-$display.apk"
            expected=$(printf '%s\n' BUILD-INFO SHA256SUMS "$client" "$luci" runtime-release-metadata.json | sort)
            actual=$(find incoming -maxdepth 1 -type f -printf '%f\n' | sort)
            test "$actual" = "$expected" || fail "unexpected Runtime release asset set"
            require_file "incoming/$client" 16777216
            require_file "incoming/$luci" 16777216
            require_file incoming/BUILD-INFO 65536
            require_file incoming/SHA256SUMS 65536
            metadata_asset "$metadata" runtime-client "incoming/$client"
            metadata_asset "$metadata" luci "incoming/$luci"
            test "$(build_value runtime_version)" = "$version" || fail "BUILD-INFO Runtime version mismatch"
            test "$(build_value runtime_revision)" = "$revision" || fail "BUILD-INFO Runtime revision mismatch"
            test "$(build_value openwrt_release)" = 25.12.4 || fail "BUILD-INFO OpenWrt release mismatch"
            test "$(build_value profile)" = x86_64 || fail "BUILD-INFO profile mismatch"
            test "$(wc -l < incoming/SHA256SUMS | tr -d ' ')" = 4 || fail "unexpected Runtime checksum count"
            (cd incoming && sha256sum -c SHA256SUMS)
            # APK metadata and checksums alone do not prove that the package
            # contains the product payload that was audited in Runtime. Do a
            # real extraction and reject deployable placeholders or truncated
            # bootstrap data before anything can become a stable release.
            payload_dir=$(mktemp -d)
            if command -v apk >/dev/null 2>&1; then
              apk extract --no-chown -p "$payload_dir" "incoming/$client" >/dev/null
            else
              # OpenWrt APK artifacts are tar-compatible; keep the gate
              # usable on the Ubuntu runner even when apk-tools is absent.
              tar -xf "incoming/$client" -C "$payload_dir"
            fi
            client_config="$payload_dir/etc/config/candy"
            client_init="$payload_dir/etc/init.d/candy"
            rules_dir="$payload_dir/usr/share/candy/rulesets"
            test -s "$client_config" || fail "Runtime APK is missing /etc/config/candy"
            test -x "$client_init" || fail "Runtime APK is missing executable /etc/init.d/candy"
            awk '
              /^config node / { in_node=1; next }
              /^config / { in_node=0 }
              in_node && /option enabled '\''1'\''/ { found=1 }
              END { exit found ? 1 : 0 }
            ' "$client_config" || fail "Runtime APK contains an enabled default node"
            ! grep -Eq "option (server|server_name) ['](127\\.0\\.0\\.1(:[0-9]+)?|localhost)" "$client_config" ||
              fail "Runtime APK contains a deployable placeholder endpoint"
            ! grep -Eq "option (server_pin|auth) ['][^']*(change-me|replace-me)" "$client_config" ||
              fail "Runtime APK contains a placeholder credential"
            test -s "$rules_dir/cn-ip.cidr" && test -s "$rules_dir/gfwlist.domains" || fail "Runtime APK is missing bootstrap rulesets"
            cidr_count=$(sed 's/#.*//' "$rules_dir/cn-ip.cidr" | sed '/^[[:space:]]*$/d' | sort -u | wc -l | tr -d ' ')
            domain_count=$(sed 's/#.*//' "$rules_dir/gfwlist.domains" | sed '/^[[:space:]]*$/d' | sort -u | wc -l | tr -d ' ')
            test "$cidr_count" -ge 5000 || fail "Runtime APK China bootstrap has only $cidr_count entries"
            test "$domain_count" -ge 4000 || fail "Runtime APK GFWList bootstrap has only $domain_count entries"
            grep -Eq '^[0-9a-fA-F:]+/[0-9]+$' "$rules_dir/cn-ip.cidr" || fail "Runtime APK China bootstrap has no IPv6 CIDR"
            grep -Fq 'fail_open_locked()' "$client_init" || fail "Runtime APK has no fail-open path"
            grep -Fq '/var/lib/candy/service.lock' "$client_init" || fail "Runtime APK lifecycle lock is not persistent/root-owned"
            key="v$(tr '.+-' '___' <<<"$version" | tr -d '\n')_r$revision"
            jq -n \
              --arg version "$version" --argjson revision "$revision" --arg display "$display" \
              --arg commit "$(jq -r .source.commit "$metadata")" \
              --arg client_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$client" \
              --arg client_sha "$(file_sha "incoming/$client")" --argjson client_size "$(file_size "incoming/$client")" \
              --arg luci_url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$luci" \
              --arg luci_sha "$(file_sha "incoming/$luci")" --argjson luci_size "$(file_size "incoming/$luci")" \
              '{version:$version,revision:$revision,display_version:$display,commit:$commit,targets:{openwrt_25_12_4_x86_64:{openwrt_release:"25.12.4",target:"x86/64",arch:"x86_64",package_format:"apk",candy_client:{url:$client_url,sha256:$client_sha,size:$client_size},luci_app_candy:{url:$luci_url,sha256:$luci_sha,size:$luci_size}}}}' > entry.json
            comparison_version=$display
          else
            metadata=incoming/core-release-metadata.json
            require_file "$metadata" 1048576
            version=$(jq -er '.core.version' "$metadata")
            release_tag="core-v$version"
            test "$STAGING_TAG" = "incoming-$release_tag" || fail "Core staging tag mismatch"
            jq -e --arg tag "$release_tag" '
              .schema_version == 1 and .release_kind == "candy-core" and .release_tag == $tag and
              .source.repository == "reTsubasa/candy-core" and (.source.commit | test("^[0-9a-f]{40}$")) and
              .target.rust_target == "x86_64-unknown-linux-musl" and .target.os == "linux" and
              .target.architecture == "x86_64" and .target.libc == "musl" and
              .signature.format == "usign" and .signature.verified == true and (.artifacts | length) == 3
            ' "$metadata" >/dev/null || fail "invalid Core release metadata"
            base="candy-core-$version-x86_64-unknown-linux-musl"
            bundle="$base.tar.gz"
            checksum="$bundle.sha256"
            manifest="$base.manifest.json"
            expected=$(printf '%s\n' "$bundle" "$checksum" "$manifest" core-release-metadata.json | sort)
            actual=$(find incoming -maxdepth 1 -type f -printf '%f\n' | sort)
            test "$actual" = "$expected" || fail "unexpected Core release asset set"
            require_file "incoming/$bundle" 134217728
            require_file "incoming/$checksum" 65536
            require_file "incoming/$manifest" 1048576
            metadata_asset "$metadata" core-bundle "incoming/$bundle"
            metadata_asset "$metadata" bundle-checksum "incoming/$checksum"
            metadata_asset "$metadata" core-manifest "incoming/$manifest"
            test "$(wc -l < "incoming/$checksum" | tr -d ' ')" = 1 || fail "unexpected Core checksum count"
            (cd incoming && sha256sum -c "$checksum")
            listing=$(tar -tzf "incoming/$bundle")
            test "$listing" = $'candy-core\nmanifest.json\nmanifest.sig' || fail "invalid Core bundle contents"
            tar -xOzf "incoming/$bundle" manifest.json > manifest.inner.json
            tar -xOzf "incoming/$bundle" manifest.sig > manifest.inner.sig
            cmp "incoming/$manifest" manifest.inner.json || fail "Core manifests differ"
            usign -V -p keys/core-release.pub -m manifest.inner.json -x manifest.inner.sig || fail "Core manifest signature is invalid"
            jq -e --arg version "$version" '
              .schema_version == 1 and .process_api_version == 1 and
              .core.core_version == $version and .core.core_api_version == 1 and
              .artifact.target == "x86_64-unknown-linux-musl" and
              .artifact.target_os == "linux" and .artifact.target_arch == "x86_64" and
              .artifact.libc == "musl"
            ' "incoming/$manifest" >/dev/null || fail "Core manifest contract mismatch"
            key="v$(tr '.+-' '___' <<<"$version" | tr -d '\n')"
            jq -n \
              --arg version "$version" --arg commit "$(jq -r .source.commit "$metadata")" \
              --argjson process_api "$(jq -r .core.process_api_version "$metadata")" \
              --argjson core_api "$(jq -r .core.core_api_version "$metadata")" \
              --arg protocol "$(jq -r .core.protocol_version "$metadata")" \
              --arg url "https://github.com/reTsubasa/candy-release/releases/download/$release_tag/$bundle" \
              --arg sha "$(file_sha "incoming/$bundle")" --argjson size "$(file_size "incoming/$bundle")" \
              '{version:$version,commit:$commit,process_api_version:$process_api,core_api_version:$core_api,protocol_version:$protocol,targets:{linux_musl_x86_64:{target:"x86_64-unknown-linux-musl",os:"linux",libc:"musl",arch:"x86_64",url:$url,sha256:$sha,size:$size}}}' > entry.json
            comparison_version=$version
          fi

          : > release-assets.ndjson
          while IFS= read -r -d '' asset; do
            jq -n \
              --arg name "${asset##*/}" \
              --arg sha256 "$(file_sha "$asset")" \
              --argjson size "$(file_size "$asset")" \
              '{name:$name,sha256:$sha256,size:$size}' >> release-assets.ndjson
          done < <(find incoming -maxdepth 1 -type f -print0 | sort -z)
          jq -s . release-assets.ndjson > release-assets.json
          jq --slurpfile assets release-assets.json '. + {release_assets:$assets[0]}' \
            entry.json > entry.json.next
          mv entry.json.next entry.json
          jq -e . entry.json >/dev/null
          {
            echo "key=$key"
            echo "version=$comparison_version"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Publish assets and signed stable catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY: ${{ steps.artifact.outputs.key }}
          RELEASE_VERSION: ${{ steps.artifact.outputs.version }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          set -Eeuo pipefail
          fail() { echo "finalize-release: $*" >&2; return 1; }
          file_sha() { sha256sum "$1" | awk '{ print tolower($1) }'; }
          file_size() { wc -c < "$1" | tr -d ' '; }
          asset_manifest() {
            local directory=$1 output=$2 asset temporary
            temporary="$output.ndjson"
            : > "$temporary"
            while IFS= read -r -d '' asset; do
              jq -n \
                --arg name "${asset##*/}" \
                --arg sha256 "$(file_sha "$asset")" \
                --argjson size "$(file_size "$asset")" \
                '{name:$name,sha256:$sha256,size:$size}' >> "$temporary"
            done < <(find "$directory" -maxdepth 1 -type f -print0 | sort -z)
            jq -s . "$temporary" > "$output"
            rm -f "$temporary"
          }
          test -n "$CATALOG_SIGNING_KEY" || fail "CANDY_CATALOG_SIGNING_KEY is not configured"
          git pull --ff-only origin main
          mkdir -p channels
          if test -f channels/stable.json; then
            jq -e '.schema_version == 1 and .channel == "stable" and (.sequence | type == "number")' channels/stable.json >/dev/null || fail "existing stable catalog is invalid"
          else
            jq -n '{schema_version:1,sequence:0,channel:"stable",published_at:null,runtime:{latest:null,releases:{}},core:{latest:null,releases:{}}}' > channels/stable.json
          fi

          decision=$(.github/scripts/catalog-policy.sh \
            channels/stable.json entry.json "$RELEASE_KIND" "$RELEASE_KEY" "$RELEASE_VERSION")
          case "$decision" in
            new|replace-latest) changed=1 ;;
            unchanged) changed=0 ;;
            *) fail "unexpected catalog policy decision: $decision" ;;
          esac

          latest_key=$(jq -r --arg kind "$RELEASE_KIND" '.[$kind].latest // empty' channels/stable.json)
          is_latest=0
          test "$latest_key" = "$RELEASE_KEY" && is_latest=1
          formal_existed=0
          formal_was_draft=false
          formal_matches=0
          mkdir -m 0700 published
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            formal_existed=1
            formal_was_draft=$(jq -r .isDraft <<<"$release_json")
            if test "$(jq '.assets | length' <<<"$release_json")" -gt 0; then
              gh release download "$RELEASE_TAG" --dir published
            fi
            asset_manifest published published-assets.json
            cmp -s published-assets.json release-assets.json && formal_matches=1
          fi

          if test "$formal_existed" = 1 && test "$formal_matches" = 0; then
            case "$decision:$is_latest" in
              replace-latest:1|unchanged:1) ;;
              *) fail "formal $RELEASE_TAG assets differ from an immutable or untracked release" ;;
            esac
          fi

          release_write=0
          if test "$formal_existed" = 0 || test "$formal_matches" = 0 || test "$formal_was_draft" = true; then
            release_write=1
          fi

          if test "$decision" = unchanged && test "$release_write" = 0; then
            echo "Release and catalog entry already finalized"
            gh release delete "$STAGING_TAG" --yes || true
            exit 0
          fi

          if test "$decision" = unchanged && test "$is_latest" = 1 && test "$release_write" = 1; then
            changed=1
          fi

          if test "$changed" = 1; then
            published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            jq --arg kind "$RELEASE_KIND" --arg key "$RELEASE_KEY" --arg published_at "$published_at" --slurpfile entry entry.json '
              .sequence += 1 |
              .published_at = $published_at |
              .[$kind].releases[$key] = $entry[0] |
              .[$kind].latest = $key
            ' channels/stable.json > channels/stable.json.next
            mv channels/stable.json.next channels/stable.json

            key_file=$(mktemp)
            chmod 0600 "$key_file"
            printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key_file"
            usign -S -s "$key_file" -m channels/stable.json -x channels/stable.json.sig
            usign -V -p keys/catalog-release.pub -m channels/stable.json -x channels/stable.json.sig

            runtime_display=$(jq -r '.runtime.latest as $key | if $key then .runtime.releases[$key].display_version else "not published" end' channels/stable.json)
            core_display=$(jq -r '.core.latest as $key | if $key then .core.releases[$key].version else "not published" end' channels/stable.json)
            sequence=$(jq -r .sequence channels/stable.json)
            published_at=$(jq -r .published_at channels/stable.json)
            python3 - "$runtime_display" "$core_display" "$sequence" "$published_at" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("README.md")
          text = path.read_text()
          start = "<!-- stable-status:start -->"
          end = "<!-- stable-status:end -->"
          block = "\n".join([
              start,
              "## Current stable channel",
              "",
              f"- Runtime: `{sys.argv[1]}`",
              f"- Core: `{sys.argv[2]}`",
              f"- Catalog sequence: `{sys.argv[3]}`",
              f"- Published at: `{sys.argv[4]}`",
              end,
          ])
          before, marker, remainder = text.partition(start)
          if not marker:
              raise SystemExit("README stable status markers are missing")
          _, marker, after = remainder.partition(end)
          if not marker:
              raise SystemExit("README stable status end marker is missing")
          path.write_text(before + block + after)
          PY

            git config user.name candy-release-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add channels/stable.json channels/stable.json.sig README.md
            git diff --cached --check
            git commit -m "release: publish $RELEASE_TAG"
          fi

          rollback_release() {
            local status=$1 name
            trap - ERR INT TERM
            set +e
            echo "finalize-release: restoring formal Release after failure" >&2
            if test "$formal_existed" = 1; then
              while IFS= read -r name; do
                test -n "$name" || continue
                test -f "published/$name" || gh release delete-asset "$RELEASE_TAG" "$name" --yes
              done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null)
              if find published -maxdepth 1 -type f -print -quit | grep -q .; then
                gh release upload "$RELEASE_TAG" published/* --clobber
              fi
              gh release edit "$RELEASE_TAG" --draft="$formal_was_draft"
            else
              gh release delete "$RELEASE_TAG" --yes
            fi
            exit "$status"
          }

          if test "$release_write" = 1; then
            trap 'rollback_release $?' ERR
            trap 'rollback_release 130' INT TERM
            if test "$formal_existed" = 1; then
              if test "$formal_matches" = 0; then
                while IFS= read -r name; do
                  test -n "$name" || continue
                  test -f "incoming/$name" || gh release delete-asset "$RELEASE_TAG" "$name" --yes
                done < <(jq -r '.[].name' published-assets.json)
                gh release upload "$RELEASE_TAG" incoming/* --clobber
              fi
            else
              if test "$RELEASE_KIND" = runtime; then
                title="Candy Runtime $RELEASE_VERSION"
              else
                title="Candy Core $RELEASE_VERSION"
              fi
              gh release create "$RELEASE_TAG" --draft --title "$title" \
                --notes "Validated by the centralized Candy release workflow."
              gh release upload "$RELEASE_TAG" incoming/*
            fi
            mkdir -m 0700 verified
            gh release download "$RELEASE_TAG" --dir verified
            asset_manifest verified verified-assets.json
            cmp verified-assets.json release-assets.json \
              || fail "formal Release verification differs from validated incoming assets"
            gh release edit "$RELEASE_TAG" --draft=false
          fi

          if test "$changed" = 1; then
            git push origin HEAD:main
          fi
          trap - ERR INT TERM
          gh release delete "$STAGING_TAG" --yes || true
